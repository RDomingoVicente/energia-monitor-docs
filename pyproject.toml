[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energia-monitor"
version = "0.7.0"
description = "Colector de precios del mercado eléctrico y precio final según contrato"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"energia_monitor.formulario" = ["estatico/*.css", "estatico/*.ico", "estatico/*.svg", "estatico/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere PostgreSQL (PGHOST)",
           "lento: tandas largas de casos aleatorios (PLAN_LENTO=1)"]
