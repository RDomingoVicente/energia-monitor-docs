name: energia-monitor

services:
  db:
    # PostgreSQL 17.12 (Debian 17.12-1.pgdg13+1, trixie). Fija el digest: un cambio
    # de glibc obliga a REINDEX (docs/contexto.md). 17.12-trixie tiene otro índice
    # pero la misma imagen amd64 (6f7593c1…).
    image: postgres:17-trixie@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energia}
      POSTGRES_USER: ${POSTGRES_USER:-energia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      TZ: Europe/Madrid
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      # Solo para acceso desde el propio NAS (psql, copias). Grafana no usa
      # este puerto: entra por la red energia-monitor_default como
      # energia-db:5432 (ver grafana/README.md).
      - "${PG_BIND:-127.0.0.1}:${PG_PORT:-5434}:5432"
    networks:
      default:
        # Nombre inequívoco para otros stacks unidos a esta red (el stack de
        # Odoo puede tener su propio servicio "db").
        aliases: [energia-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    image: ${HARBOR_REGISTRY:?definir HARBOR_REGISTRY en .env}/${HARBOR_PROJECT:-energia}/collector:${COLLECTOR_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-energia}
      PGUSER: ${POSTGRES_USER:-energia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PRICE_SOURCE: ${PRICE_SOURCE:-omie}
      ESIOS_TOKEN: ${ESIOS_TOKEN:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      # Rol formulario_rw (0016); lo usará el servicio formulario (paso 3b).
      FORMULARIO_DB_PASSWORD: ${FORMULARIO_DB_PASSWORD:-}
      CARGA_INICIAL_DESDE: ${CARGA_INICIAL_DESDE:-2025-10-01}
      HORARIOS: ${HORARIOS:-13:30,17:30,20:30}
      INTERVALO_DESCARGAS_S: ${INTERVALO_DESCARGAS_S:-1}
      ESIOS_CARGA_DESDE: ${ESIOS_CARGA_DESDE:-2026-01-01}
      ESIOS_HORARIOS: ${ESIOS_HORARIOS:-08:30,21:00,22:00}
      TZ: Europe/Madrid

  # Muestreo del cargador (fase 2, etapa 1): misma imagen, proceso continuo
  # separado de la descarga de precios. Solo lecturas (GET). Sin VIARIS_URL
  # queda en espera sin hacer nada.
  muestreo:
    image: ${HARBOR_REGISTRY}/${HARBOR_PROJECT:-energia}/collector:${COLLECTOR_TAG:-latest}
    command: ["python", "-m", "energia_monitor", "cargador", "muestrear"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-energia}
      PGUSER: ${POSTGRES_USER:-energia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      VIARIS_URL: ${VIARIS_URL:-}
      TZ: Europe/Madrid

  # Formulario de batería (fase 2, etapa 2, E2.9): HTTPS solo dentro del tailnet,
  # nunca con Tailscale Funnel. Rol formulario_rw; la página no consulta el
  # cargador (VIARIS_URL solo da la etiqueta del chip). Certificados y arranque
  # tras Tailscale: deploy/README.md.
  formulario:
    image: ${HARBOR_REGISTRY}/${HARBOR_PROJECT:-energia}/collector:${COLLECTOR_TAG:-latest}
    # Nombre fijo: lo usa el script de renovación del certificado (deploy_ct).
    container_name: energia-formulario
    command: ["python", "-m", "energia_monitor", "formulario", "servir"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      collector:
        condition: service_started
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-energia}
      PGUSER: formulario_rw
      PGPASSWORD: ${FORMULARIO_DB_PASSWORD:?definir FORMULARIO_DB_PASSWORD en .env}
      FORMULARIO_HOST: ${FORMULARIO_HOST:?definir FORMULARIO_HOST en .env}
      FORMULARIO_GRAFANA_URL: ${FORMULARIO_GRAFANA_URL:-}
      VIARIS_URL: ${VIARIS_URL:-}
      TZ: Europe/Madrid
    volumes:
      - ./certs:/certs:ro
    ports:
      - "${FORMULARIO_BIND:?definir FORMULARIO_BIND (IP del NAS en el tailnet) en .env}:8421:8443"
    healthcheck:
      test: ["CMD", "python", "-m", "energia_monitor", "formulario", "salud"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    # Nombre fijo: el stack de Grafana se une a ella como red externa.
    name: energia-monitor_default
